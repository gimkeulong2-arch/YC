<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0b0d12"
  >

  <title>윤강닷컴</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #0b0d12 0%,
          #11151d 100%
        );

      color: #ffffff;
    }

    .app {
      width: 100%;
      max-width: 620px;

      margin: 0 auto;
      padding:
        42px
        20px
        60px;
    }

    .brand {
      margin-bottom: 42px;
    }

    .brand-label {
      display: inline-block;

      margin-bottom: 12px;

      padding:
        6px
        11px;

      border-radius: 999px;

      background:
        rgba(
          255,
          255,
          255,
          0.08
        );

      color: #b7becb;

      font-size: 12px;
      font-weight: 700;

      letter-spacing: 0.08em;
    }

    h1 {
      margin: 0;

      font-size:
        clamp(
          36px,
          11vw,
          54px
        );

      line-height: 1.05;
      letter-spacing: -0.055em;
    }

    .intro {
      margin:
        16px
        0
        0;

      color: #9ca5b5;

      font-size: 16px;
      line-height: 1.65;
    }

    .services {
      display: grid;
      gap: 15px;
    }

    .service {
      position: relative;

      display: block;

      min-height: 178px;

      padding: 23px;

      overflow: hidden;

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.08
        );

      border-radius: 25px;

      background:
        rgba(
          255,
          255,
          255,
          0.055
        );

      color: inherit;

      text-decoration: none;

      transition:
        transform 0.15s ease,
        background 0.15s ease;
    }

    .service:active {
      transform:
        scale(0.985);

      background:
        rgba(
          255,
          255,
          255,
          0.09
        );
    }

    .icon {
      display: flex;

      align-items: center;
      justify-content: center;

      width: 47px;
      height: 47px;

      margin-bottom: 23px;

      border-radius: 15px;

      font-size: 23px;
    }

    .giants .icon {
      background: #d91e36;
    }

    .law .icon {
      background: #315be8;
    }

    .day .icon {
      background: #7c4dff;
    }

    .service h2 {
      margin:
        0
        0
        7px;

      font-size: 22px;

      letter-spacing:
        -0.035em;
    }

    .service p {
      margin: 0;

      max-width: 90%;

      color: #9ca5b5;

      font-size: 14px;
      line-height: 1.55;
    }

    .arrow {
      position: absolute;

      right: 22px;
      bottom: 22px;

      color: #7e8796;

      font-size: 22px;
    }

    .footer {
      margin-top: 35px;

      text-align: center;

      color: #626b79;

      font-size: 12px;
    }

    @media (
      min-width: 700px
    ) {
      .app {
        padding-top: 70px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="brand">

      <div class="brand-label">
        YUNGANG.COM
      </div>

      <h1>
        윤강닷컴
      </h1>

      <p class="intro">
        필요한 서비스를 선택하세요.
      </p>

    </header>

    <section class="services">

      <a
        class="service giants"
        href="#"
        onclick="
          comingSoon(
            '윤강 자이언츠'
          );
          return false;
        "
      >

        <div class="icon">
          ⚾
        </div>

        <h2>
          윤강 자이언츠
        </h2>

        <p>
          롯데 자이언츠 경기,
          일정, 순위와 선수 정보를
          확인합니다.
        </p>

        <span class="arrow">
          ›
        </span>

      </a>


      <a
        class="service law"
        href="#"
        onclick="
          comingSoon(
            '김윤강의 법률상담소'
          );
          return false;
        "
      >

        <div class="icon">
          ⚖️
        </div>

        <h2>
          김윤강의 법률상담소
        </h2>

        <p>
          상황을 입력하고
          관련 법률과 법적 정보를
          확인합니다.
        </p>

        <span class="arrow">
          ›
        </span>

      </a>


      <a
        class="service day"
        href="#"
        onclick="
          comingSoon(
            '윤강데이'
          );
          return false;
        "
      >

        <div class="icon">
          ⏰
        </div>

        <h2>
          윤강데이
        </h2>

        <p>
          원하는 시간과 이름으로
          알람과 알림을
          간편하게 설정합니다.
        </p>

        <span class="arrow">
          ›
        </span>

      </a>

    </section>

    <footer class="footer">
      윤강닷컴
    </footer>

  </main>


  <script>
    function comingSoon(
      name
    ) {
      alert(
        name +
        "은(는) 현재 준비 중입니다."
      );
    }
  </script>

</body>
</html>
